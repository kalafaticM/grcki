<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ελληνικά — praktični grčki za putovanje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gips:#FBF9F4;      /* zid okrečen u belo */
  --gips2:#F2EEE4;
  --egej:#2E6FA7;      /* egejsko plavo */
  --egej-svetlo:#DCE9F4;
  --bugenvilija:#C6497B;/* akcenat */
  --maslina:#6E7F4E;
  --mastilo:#1E2A33;
  --tiho:#6B7A85;
  --ivica:#E3DDD0;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--gips);color:var(--mastilo);
  font:400 16px/1.6 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--egej)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ── zaglavlje ── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(251,249,244,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--ivica);
}
.hd{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{font:800 22px/1 Fraunces,serif;letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--egej)}
#q{
  flex:1;min-width:180px;border:1.5px solid var(--ivica);border-radius:999px;
  padding:10px 16px;font:400 15px Inter,sans-serif;background:#fff;color:var(--mastilo);
}
#q:focus{outline:none;border-color:var(--egej);box-shadow:0 0 0 3px var(--egej-svetlo)}
.hd-akcije{display:flex;gap:8px}
.mini{
  border:1.5px solid var(--ivica);background:#fff;border-radius:999px;
  padding:9px 14px;font:500 14px Inter,sans-serif;color:var(--mastilo);cursor:pointer;
}
.mini:hover{border-color:var(--egej);color:var(--egej)}
.mini.on{background:var(--egej);border-color:var(--egej);color:#fff}

/* ── hero ── */
.hero{padding:56px 0 40px;border-bottom:1px solid var(--ivica)}
.hero h1{
  font:800 clamp(34px,6vw,58px)/1.05 Fraunces,serif;
  letter-spacing:-.03em;margin:0 0 14px;max-width:16ch;
}
.hero h1 em{font-style:normal;color:var(--egej)}
.hero p{font-size:18px;color:var(--tiho);max-width:52ch;margin:0 0 26px}
.brojke{display:flex;gap:28px;flex-wrap:wrap}
.brojka b{display:block;font:600 26px Fraunces,serif;color:var(--bugenvilija)}
.brojka span{font-size:13px;color:var(--tiho);text-transform:uppercase;letter-spacing:.08em}

/* ── filteri ── */
.filteri{display:flex;gap:8px;flex-wrap:wrap;padding:26px 0 6px}

/* ── mreža lekcija ── */
.mreza{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:18px 0 60px}
.kart{
  background:#fff;border:1px solid var(--ivica);border-radius:var(--r);
  padding:20px;cursor:pointer;transition:.18s;text-align:left;font:inherit;color:inherit;
}
.kart:hover{border-color:var(--egej);transform:translateY(-2px);box-shadow:0 8px 24px rgba(46,111,167,.10)}
.kart:focus-visible{outline:2px solid var(--egej);outline-offset:2px}
.oznaka{
  display:inline-block;font:500 11px IBM Plex Mono,monospace;letter-spacing:.1em;
  color:var(--egej);background:var(--egej-svetlo);padding:3px 8px;border-radius:6px;margin-bottom:10px;
}
.kart h3{font:600 19px/1.25 Fraunces,serif;margin:0 0 4px}
.kart .gr{font-size:14px;color:var(--bugenvilija);margin:0 0 8px}
.kart .op{font-size:14px;color:var(--tiho);margin:0}
.prazno{padding:50px 0;color:var(--tiho);text-align:center;grid-column:1/-1}

/* ── modal lekcije ── */
.pozadina{
  position:fixed;inset:0;background:rgba(30,42,51,.45);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;
}
.pozadina.vidi{display:flex}
.list{
  background:var(--gips);border-radius:18px;max-width:760px;width:100%;
  box-shadow:0 24px 60px rgba(30,42,51,.28);position:relative;
}
.list-vrh{
  position:sticky;top:0;background:var(--gips);border-bottom:1px solid var(--ivica);
  padding:22px 26px 16px;border-radius:18px 18px 0 0;z-index:2;
}
.list-vrh h2{font:800 28px/1.1 Fraunces,serif;margin:8px 0 2px;letter-spacing:-.02em}
.list-vrh .gr{color:var(--bugenvilija);font-size:15px;margin:0}
.zatvori{
  position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--ivica);background:#fff;cursor:pointer;font-size:18px;color:var(--tiho);line-height:1;
}
.zatvori:hover{border-color:var(--bugenvilija);color:var(--bugenvilija)}
.telo{padding:8px 26px 30px}
.telo h4{
  font:500 12px IBM Plex Mono,monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tiho);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--ivica);
}
.telo h4:first-child{margin-top:20px}

.par{padding:9px 0;border-bottom:1px dashed var(--ivica)}
.par .g{font-weight:600;color:var(--egej)}
.par .s{color:var(--tiho);font-size:15px}
.par .iz,.replika .iz{font:400 13.5px IBM Plex Mono,monospace;color:var(--maslina);margin:1px 0}
.zad .iz{font:400 13px IBM Plex Mono,monospace;color:var(--maslina);margin-top:3px}

.rec{
  display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px 14px;
  background:#fff;border:1px solid var(--ivica);border-radius:10px;padding:12px 14px;
}
.rec div{padding:5px 0;font-size:15px;border-bottom:1px solid var(--gips2)}
.rec div:nth-last-child(-n+3){border-bottom:none}
.rec .iz{font:400 14px IBM Plex Mono,monospace;color:var(--maslina)}
.rec .g{font-weight:600;color:var(--egej)}

.dij{background:#fff;border:1px solid var(--ivica);border-radius:10px;padding:6px 16px}
.replika{padding:11px 0;border-bottom:1px solid var(--gips2)}
.replika:last-child{border-bottom:none}
.replika .g{font-weight:600;color:var(--mastilo)}
.replika .s{color:var(--tiho);font-size:14px}
.replika.b .g{color:var(--egej)}

.napomena{
  background:var(--egej-svetlo);border-left:3px solid var(--egej);
  border-radius:0 10px 10px 0;padding:14px 16px;font-size:15px;
}

/* vežba */
.vezba{counter-reset:v}
.zad{background:#fff;border:1px solid var(--ivica);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.zad .pit{font-size:15px;margin-bottom:8px}
.zad .pit::before{
  counter-increment:v;content:counter(v) ".";
  font:500 13px IBM Plex Mono,monospace;color:var(--bugenvilija);margin-right:8px;
}
.otkrij{
  border:1px solid var(--ivica);background:var(--gips2);border-radius:8px;
  padding:6px 12px;font:500 13px Inter,sans-serif;cursor:pointer;color:var(--tiho);
}
.otkrij:hover{border-color:var(--maslina);color:var(--maslina)}
.odg{display:none;margin-top:8px;font-weight:600;color:var(--maslina)}
.odg.vidi{display:block}

/* kartice za učenje */
.karta-flip{
  background:#fff;border:1px solid var(--ivica);border-radius:14px;
  padding:40px 24px;text-align:center;min-height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.karta-flip .veliko{font:600 30px Fraunces,serif;color:var(--egej);line-height:1.2}
.karta-flip .malo{font-size:17px;color:var(--tiho);min-height:26px}
.flip-kontrole{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.flip-brojac{text-align:center;font:500 13px IBM Plex Mono,monospace;color:var(--tiho);margin-top:10px}

/* tabovi */
.tabovi{display:flex;gap:6px;background:var(--gips2);padding:4px;border-radius:999px}
.tab{
  border:none;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;
  font:600 14px Inter,sans-serif;color:var(--tiho);white-space:nowrap;
}
.tab.on{background:#fff;color:var(--egej);box-shadow:0 1px 3px rgba(30,42,51,.10)}

/* lekcije kursa */
.dani{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:18px 0 60px}
.dan{
  background:#fff;border:1px solid var(--ivica);border-radius:var(--r);
  padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.18s;
  display:flex;gap:14px;align-items:flex-start;
}
.dan:hover{border-color:var(--bugenvilija);transform:translateY(-2px);box-shadow:0 8px 24px rgba(198,73,123,.10)}
.dan:focus-visible{outline:2px solid var(--egej);outline-offset:2px}
.dan-br{
  flex:none;width:38px;height:38px;border-radius:10px;background:var(--egej-svetlo);
  color:var(--egej);display:flex;align-items:center;justify-content:center;
  font:600 15px Fraunces,serif;
}
.dan.o .dan-br{background:#F6E4EC;color:var(--bugenvilija);font-size:13px}
.dan h3{font:600 16px/1.3 Fraunces,serif;margin:2px 0 3px}
.dan .pod{font-size:13px;color:var(--tiho)}

/* sadržaj lekcije u modalu */
.k-pasus{margin:12px 0;font-size:15.5px}
.k-lista{margin:12px 0 12px 4px;padding-left:20px;font-size:15.5px}
.k-lista li{margin:5px 0}
.k-tab{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px;
  background:#fff;border:1px solid var(--ivica);border-radius:10px;overflow:hidden}
.k-tab th{
  background:var(--egej-svetlo);color:var(--egej);text-align:left;
  font:600 12px Inter,sans-serif;letter-spacing:.04em;padding:9px 12px;
}
.k-tab td{padding:8px 12px;border-top:1px solid var(--gips2);vertical-align:top}
.k-tab tr:nth-child(even) td{background:#FCFBF8}
.k-tab td:first-child{font-weight:500}
.k-omot{overflow-x:auto;-webkit-overflow-scrolling:touch}
.telo b{color:var(--mastilo)}
.telo i{color:var(--egej);font-style:normal;font-weight:500}

footer{border-top:1px solid var(--ivica);padding:30px 0 44px;color:var(--tiho);font-size:14px}

@media(max-width:560px){
  .rec{grid-template-columns:1fr;gap:0}
  .rec .g,.rec .iz{padding-bottom:0;border:none}
  .rec .iz{padding-top:0}
  .telo,.list-vrh{padding-left:18px;padding-right:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo">Ελληνικά<span>.</span></div>
    <input id="q" type="search" placeholder="Traži reč ili frazu — npr. račun, νερό, plaža" aria-label="Pretraga">
    <div class="tabovi" id="tabovi">
      <button class="tab on" data-tab="kurs">Kurs</button>
      <button class="tab" data-tab="situacije">Situacije</button>
    </div>
    <div class="hd-akcije">
      <button class="mini" id="btn-flip">Kartice</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Grčki za <em>početak</em>.</h1>
    <p id="hero-p">Petnaest lekcija gramatike, jedna dnevno — od azbuke do prošlog vremena. Rečnik, dijalog i vežbe sa rešenjima.</p>
    <div class="brojke" id="brojke"></div>
  </div>
</section>

<div class="wrap">
  <div id="panel-kurs">
    <div class="dani" id="dani"></div>
  </div>
  <div id="panel-situacije" hidden>
    <div class="filteri" id="filteri"></div>
    <div class="mreza" id="mreza"></div>
  </div>
</div>

<footer class="wrap">
  Praktični kurs grčkog jezika · dodatak A · situacije A1–A24
</footer>

<div class="pozadina" id="modal">
  <div class="list" role="dialog" aria-modal="true" aria-labelledby="m-naslov">
    <div class="list-vrh">
      <button class="zatvori" id="zatvori" aria-label="Zatvori">✕</button>
      <span class="oznaka" id="m-oznaka"></span>
      <h2 id="m-naslov"></h2>
      <p class="gr" id="m-gr"></p>
    </div>
    <div class="telo" id="m-telo"></div>
  </div>
</div>

<script>
const KURS = [{"vrsta":"odeljak","br":"","naslov":"Kako koristiti ovaj kurs","blokovi":[{"tip":"pasus","tekst":"Kurs obuhvata najvažnije sadržaje nivoa A1 prema CEFR-u: azbuku i izgovor, rod i član, osnovnu upotrebu nominativa, akuzativa i genitiva, glagole A i B grupe u prezentu, najčešće oblike prošlog i budućeg vremena, konstrukcije sa να, prideve, zamenice, predloge i priloge. Težište je na turističkoj i svakodnevnoj komunikaciji."},{"tip":"pasus","tekst":"<b>Ritam:</b> jedna lekcija dnevno, 45--60 minuta. Svaka lekcija ima: gramatiku → rečnik → dijalog → vežbe. Rešenja su na kraju dokumenta."},{"tip":"pasus","tekst":"Transkripcija: koristi se pojednostavljena srpska transkripcija u zagradama. Ona služi samo kao pomoć na početku; cilj je da se što pre čita grčko pismo. Grčki naglasak je obavezan u pisanju višesložnih reči. Promena mesta naglaska ponekad menja značenje: γέρος = starac, γερός = jak."}]},{"vrsta":"lekcija","br":"0","naslov":"Azbuka, izgovor, naglasak","blokovi":[{"tip":"podnaslov","tekst":"Alfabet (24 slova)"},{"tip":"tabela","zaglavlje":["<b>Slovo</b>","<b>Ime</b>","<b>Izgovor</b>"],"redovi":[["Α α","άλφα","a"],["Β β","βήτα","<b>v</b> (ne b!)"],["Γ γ","γάμα","grleno <i>g</i> / pred e,i → <i>j</i>"],["Δ δ","δέλτα","zvučno <i>th</i> (kao eng. <i>this</i>)"],["Ε ε","έψιλον","e"],["Ζ ζ","ζήτα","z"],["Η η","ήτα","<b>i</b>"],["Θ θ","θήτα","bezvučno <i>th</i> (kao eng. <i>think</i>)"],["Ι ι","γιώτα","i"],["Κ κ","κάπα","k"],["Λ λ","λάμδα","l"],["Μ μ","μι","m"],["Ν ν","νι","n"],["Ξ ξ","ξι","ks"],["Ο ο","όμικρον","o"],["Π π","πι","p"],["Ρ ρ","ρο","r"],["Σ σ/ς","σίγμα","s (<b>ς</b> samo na kraju reči)"],["Τ τ","ταφ","t"],["Υ υ","ύψιλον","<b>i</b>"],["Φ φ","φι","f"],["Χ χ","χι","h"],["Ψ ψ","ψι","ps"],["Ω ω","ωμέγα","<b>o</b>"]]},{"tip":"pasus","tekst":"Zapamti: β = v; η i υ najčešće se čitaju kao i; ω se čita kao o. Posebno vežbaj θ, δ, χ i γ, jer nemaju potpuno iste glasove u srpskom."},{"tip":"podnaslov","tekst":"Dvoglasi i grupe (obavezno naučiti)"},{"tip":"tabela","zaglavlje":["<b>Grupa</b>","<b>Izgovor</b>","<b>Primer</b>"],"redovi":[["αι","<b>e</b>","και (ke) = i"],["ει, οι, υι","<b>i</b>","είναι (<b>i</b>ne) = jeste"],["ου","<b>u</b>","ούζο (<b>u</b>zo)"],["αυ","av / af","αυτό (af<b>to</b>) = ovo"],["ευ","ev / ef","ευχαριστώ (efhari<b>sto</b>)"],["μπ","b (na početku) / mb (u sredini)","μπίρα (<b>bi</b>ra) = pivo"],["ντ","d / nd","ντομάτα (do<b>ma</b>ta) = paradajz"],["γκ, γγ","g / ng","γκαρσόν (gar<b>son</b>)"],["τσ","c/č (meko)","τσάι (<b>ca</b>i) = čaj"],["τζ","dž","τζατζίκι (dza<b>dzi</b>ki)"],["γι, γει","j","γιατί (ja<b>ti</b>) = zašto"]]},{"tip":"pasus","tekst":"Pravilo za αυ/ευ: pred bezvučnim suglasnikom (κ, π, τ, φ, θ, χ, σ, ξ, ψ) čita se <b>af/ef</b>, inače <b>av/ev</b>."},{"tip":"podnaslov","tekst":"Interpunkcija"},{"tip":"lista","stavke":["Znak pitanja je <b>;</b> — Πού είναι; = Gde je?","Tačka-zapeta je · (ano teleia).","Naglasak (´) piše se <b>uvek</b> na višesložnim rečima."]},{"tip":"podnaslov","tekst":"Vežba 0"},{"tip":"pasus","tekst":"Pročitaj naglas: <i>καλημέρα, ευχαριστώ, ναι, όχι, μπίρα, ψωμί, νερό, είναι, αυτό, τσάι.</i>"},{"tip":"pasus","tekst":"Samoprovera: pokušaj da pročitaš reči najpre bez transkripcije, zatim proveri izgovor. Obrati pažnju na ευχαριστώ (efharistó), όχι (óhi) i αυτό (aftó)."}]},{"vrsta":"lekcija","br":"1","naslov":"Pozdravi, lične zamenice, glagol ΕΙΜΑΙ (biti)","blokovi":[{"tip":"podnaslov","tekst":"Pozdravi"},{"tip":"tabela","zaglavlje":["<b>Grčki</b>","<b>Izgovor</b>","<b>Značenje</b>"],"redovi":[["Καλημέρα","kali<b>me</b>ra","Dobro jutro / dobar dan (do ~13h)"],["Καλησπέρα","kali<b>spe</b>ra","Dobro veče (od ~14h)"],["Καληνύχτα","kali<b>nih</b>ta","Laku noć (samo na rastanku, pred spavanje)"],["Γεια σου","ja su","Zdravo (jednom, neformalno)"],["Γεια σας","ja sas","Zdravo (formalno ili više ljudi)"],["Χαίρετε","<b>he</b>rete","Zdravo (neutralno-formalno)"],["Αντίο","a<b>di</b>o","Zbogom"],["Τα λέμε","ta <b>le</b>me","Vidimo se"],["Καλώς ήρθατε","ka<b>los ir</b>thate","Dobrodošli"],["Ευχαριστώ (πολύ)","efhari<b>sto</b> (po<b>li</b>)","Hvala (mnogo)"],["Παρακαλώ","paraka<b>lo</b>","Molim / izvolite / nema na čemu"],["Συγγνώμη","si<b>gno</b>mi","Izvinite"],["Ναι / Όχι","ne / <b>o</b>hi","<b>Da</b> / Ne"]]},{"tip":"pasus","tekst":"Pažnja: grčko <b>ναι</b> (ne) znači <b>DA</b>. Za \"ne\" se kaže <b>όχι</b>."},{"tip":"podnaslov","tekst":"Lične zamenice (nominativ)"},{"tip":"tabela","zaglavlje":["","<b>Grčki</b>","<b>Izgovor</b>"],"redovi":[["ja","εγώ","e<b>go</b>"],["ti","εσύ","e<b>si</b>"],["on / ona / ono","αυτός / αυτή / αυτό","af<b>tos</b> / af<b>ti</b> / af<b>to</b>"],["mi","εμείς","e<b>mis</b>"],["vi","εσείς","e<b>sis</b>"],["oni / one / ona","αυτοί / αυτές / αυτά","af<b>ti</b> / af<b>tes</b> / af<b>ta</b>"]]},{"tip":"pasus","tekst":"Zamenica se <b>obično izostavlja</b> jer nastavak glagola već pokazuje lice. Koristi se samo za naglasak: <i>Εγώ είμαι από τη Σερβία.</i> = <b>Ja</b> sam iz Srbije."},{"tip":"podnaslov","tekst":"Glagol είμαι = biti (nepravilan, najvažniji)"},{"tip":"tabela","zaglavlje":["<b>Lice</b>","<b>Prezent</b>","<b>Izgovor</b>","<b>Imperfekt (bio sam)</b>"],"redovi":[["ja","είμαι","<b>i</b>me","ήμουν (<b>i</b>mun)"],["ti","είσαι","<b>i</b>se","ήσουν (<b>i</b>sun)"],["on/ona","είναι","<b>i</b>ne","ήταν (<b>i</b>tan)"],["mi","είμαστε","<b>i</b>maste","ήμασταν (<b>i</b>mastan)"],["vi","είστε / είσαστε","<b>i</b>ste","ήσασταν (<b>i</b>sastan)"],["oni","είναι","<b>i</b>ne","ήταν (<b>i</b>tan)"]]},{"tip":"pasus","tekst":"<b>Odričan oblik:</b> čestica <b>δεν</b> ide ispred glagola. <i>Δεν είμαι Έλληνας.</i> (den <b>i</b>me <b>E</b>linas) = Nisam Grk."},{"tip":"pasus","tekst":"<b>Pitanje:</b> isti red reči, samo intonacija + znak <b>;</b> <i>Είσαι από την Ελλάδα;</i> = Jesi li iz Grčke?"},{"tip":"podnaslov","tekst":"Predstavljanje"},{"tip":"tabela","zaglavlje":["<b>Grčki</b>","<b>Izgovor</b>","<b>Značenje</b>"],"redovi":[["Πώς σε λένε;","pos se <b>le</b>ne","Kako se zoveš?"],["Με λένε Μίλιβοϊ.","me <b>le</b>ne","Zovem se Milivoj."],["Είμαι ο Νίκος.","<b>i</b>me o <b>Ni</b>kos","Ja sam Nikos."],["Από πού είσαι;","apo <b>pu i</b>se","Odakle si?"],["Είμαι από τη Σερβία.","<b>i</b>me apo ti Ser<b>vi</b>a","Iz Srbije sam."],["Τι κάνεις; / Τι κάνετε;","ti <b>ka</b>nis / ti <b>ka</b>nete","Kako si? / Kako ste?"],["Καλά, ευχαριστώ.","ka<b>la</b>","Dobro, hvala."],["Χαίρω πολύ.","<b>he</b>ro po<b>li</b>","Drago mi je."],["Δεν καταλαβαίνω.","den katala<b>ve</b>no","Ne razumem."],["Μιλάτε αγγλικά;","mi<b>la</b>te agli<b>ka</b>","Govorite li engleski?"],["Πιο αργά, παρακαλώ.","pjo ar<b>ga</b>","Sporije, molim."]]},{"tip":"podnaslov","tekst":"Dijalog 1"},{"tip":"pasus","tekst":"— Καλημέρα! Πώς σε λένε; — Με λένε Άννα. Εσύ; — Είμαι ο Γιώργος. Από πού είσαι; — Είμαι από τη Σερβία. Δεν είμαι Ελληνίδα. — Χαίρω πολύ!"},{"tip":"podnaslov","tekst":"Vežba 1"},{"tip":"pasus","tekst":"Prevedi na grčki: (a) Ja sam iz Srbije. (b) Nisi Grk. (c) Kako se zovete? (d) Ne razumem, sporije molim. (e) Oni su dobro."}]},{"vrsta":"lekcija","br":"2","naslov":"Rod imenica i član","blokovi":[{"tip":"pasus","tekst":"Svaka grčka imenica ima <b>rod</b> (muški, ženski, srednji), a član ga pokazuje. <b>Član se uvek uči zajedno sa imenicom</b> — ne uči <i>ψωμί</i>, uči <i>το ψωμί</i>."},{"tip":"podnaslov","tekst":"Određeni član (nominativ jednine)"},{"tip":"tabela","zaglavlje":["<b>Rod</b>","<b>Član</b>","<b>Tipičan nastavak</b>","<b>Primer</b>"],"redovi":[["muški","<b>ο</b> (o)","-ος, -ας, -ης","ο άντρας (o <b>a</b>dras) = muškarac"],["ženski","<b>η</b> (i)","-α, -η","η γυναίκα (i ji<b>ne</b>ka) = žena"],["srednji","<b>το</b> (to)","-ο, -ι, -μα","το παιδί (to pe<b>di</b>) = dete"]]},{"tip":"podnaslov","tekst":"Neodređeni član"},{"tip":"tabela","zaglavlje":["<b>Rod</b>","<b>Član</b>","<b>Primer</b>"],"redovi":[["muški","<b>ένας</b> (<b>e</b>nas)","ένας καφές = jedna kafa"],["ženski","<b>μια / μία</b> (mja)","μια μπίρα = jedno pivo"],["srednji","<b>ένα</b> (<b>e</b>na)","ένα νερό = jedna voda"]]},{"tip":"pasus","tekst":"Neodređeni član = broj \"jedan\". Za množinu ga nema: <i>Θέλω μπίρες.</i> = Hoću piva."},{"tip":"pasus","tekst":"Grčki koristi određeni član <b>mnogo češće</b> nego srpski — i uz vlastita imena i uz opšte pojmove: <i>Ο Γιώργος είναι εδώ.</i> = Đorđe je ovde. <i>Μου αρέσει ο καφές.</i> = Volim kafu."},{"tip":"podnaslov","tekst":"Rečnik: osnovne imenice"},{"tip":"pasus","tekst":"<b>Muški (ο):</b> ο καφές (kafa), ο λογαριασμός (račun), ο δρόμος (ulica), ο φίλος (prijatelj), ο άντρας (muškarac), ο σταθμός (stanica)"},{"tip":"pasus","tekst":"<b>Ženski (η):</b> η μπίρα (pivo), η ζάχαρη (šećer), η πόρτα (vrata), η γυναίκα (žena), η τιμή (cena), η πλατεία (trg)"},{"tip":"pasus","tekst":"<b>Srednji (το):</b> το ψωμί (hleb), το νερό (voda), το γάλα (mleko), το τυρί (sir), το κρασί (vino), το παιδί (dete), το ξενοδοχείο (hotel)"},{"tip":"podnaslov","tekst":"Vežba 2"},{"tip":"pasus","tekst":"Dodaj tačan član: \\_\\_\\_ νερό, \\_\\_\\_ καφές, \\_\\_\\_ μπίρα, \\_\\_\\_ ψωμί, \\_\\_\\_ γυναίκα, \\_\\_\\_ κρασί."}]},{"vrsta":"lekcija","br":"3","naslov":"Akuzativ jednine i glagol ΕΧΩ (imati)","blokovi":[{"tip":"pasus","tekst":"<b>Akuzativ</b> je padež objekta — ono što imaš, hoćeš, kupuješ, jedeš. Posle glagola <i>έχω, θέλω, αγοράζω, τρώω</i> i posle predloga (σε, με, για, από) imenica ide u <b>akuzativ</b>."},{"tip":"podnaslov","tekst":"Promena člana i imenice"},{"tip":"tabela","zaglavlje":["<b>Rod</b>","<b>Nominativ</b>","<b>Akuzativ</b>"],"redovi":[["muški","<b>ο</b> καφές","<b>τον</b> καφέ"],["muški","<b>ο</b> λογαριασμός","<b>τον</b> λογαριασμό"],["ženski","<b>η</b> μπίρα","<b>την</b> μπίρα"],["ženski","<b>η</b> τιμή","<b>την</b> τιμή"],["srednji","<b>το</b> ψωμί","<b>το</b> ψωμί"]]},{"tip":"pasus","tekst":"Pravila: 1. <b>Srednji rod se NE menja</b> (nom. = akuz.). Velika olakšica. 2. <b>Ženski rod:</b> imenica se ne menja, samo član η → <b>την</b>. 3. <b>Muški rod:</b> član ο → <b>τον</b>, a imenica <b>gubi krajnje -ς</b>: καφές → καφέ, φίλος → φίλο."},{"tip":"podnaslov","tekst":"Glagol έχω = imati"},{"tip":"tabela","zaglavlje":["<b>Lice</b>","<b>Grčki</b>","<b>Izgovor</b>"],"redovi":[["imam","έχω","<b>e</b>ho"],["imaš","έχεις","<b>e</b>his"],["ima","έχει","<b>e</b>hi"],["imamo","έχουμε","<b>e</b>hume"],["imate","έχετε","<b>e</b>hete"],["imaju","έχουν","<b>e</b>hun"]]},{"tip":"pasus","tekst":"<i>Έχω έναν φίλο.</i> = Imam jednog prijatelja. <i>Δεν έχω χρόνο.</i> = Nemam vremena. <i>Έχετε ψωμί;</i> = Imate li hleba?"},{"tip":"pasus","tekst":"<b>Neodređeni član u akuzativu:</b> ένας → <b>έναν</b>, μια → <b>μια</b>, ένα → <b>ένα</b>."},{"tip":"podnaslov","tekst":"Bezlično \"ima / nema\" (za postojanje)"},{"tip":"pasus","tekst":"<i>Υπάρχει...;</i> (i<b>par</b>hi) = Ima li...? / Postoji li...? <i>Δεν υπάρχει πρόβλημα.</i> = Nema problema."},{"tip":"podnaslov","tekst":"Vežba 3"},{"tip":"pasus","tekst":"Stavi u akuzativ: (a) Θέλω \\_\\_\\_ (ο καφές). (b) Έχεις \\_\\_\\_ (η τιμή); (c) Πληρώνω \\_\\_\\_ (ο λογαριασμός). (d) Τρώω \\_\\_\\_ (το ψωμί)."}]},{"vrsta":"lekcija","br":"4","naslov":"Glagoli A grupe (prezent)","blokovi":[{"tip":"pasus","tekst":"Grčki glagoli se u prezentu dele u dve grupe prema naglasku."},{"tip":"pasus","tekst":"<b>A grupa</b> — naglasak <b>nije</b> na kraju (npr. <b>μέ</b>νω). To je većina glagola."},{"tip":"podnaslov","tekst":"Obrazac: μένω (živeti, stanovati)"},{"tip":"tabela","zaglavlje":["<b>Lice</b>","<b>Oblik</b>","<b>Nastavak</b>"],"redovi":[["ja","μέν<b>ω</b>","-ω"],["ti","μέν<b>εις</b>","-εις"],["on/ona","μέν<b>ει</b>","-ει"],["mi","μέν<b>ουμε</b>","-ουμε"],["vi","μέν<b>ετε</b>","-ετε"],["oni","μέν<b>ουν</b>","-ουν"]]},{"tip":"pasus","tekst":"Svaki glagol A grupe ide po ovom obrascu. Uči samo osnovu."},{"tip":"podnaslov","tekst":"Ključni glagoli A grupe"},{"tip":"tabela","zaglavlje":["<b>Glagol</b>","<b>Izgovor</b>","<b>Značenje</b>"],"redovi":[["μένω","<b>me</b>no","živeti, stanovati"],["θέλω","<b>the</b>lo","hteti, želeti"],["κάνω","<b>ka</b>no","raditi, činiti"],["ξέρω","<b>kse</b>ro","znati"],["καταλαβαίνω","k >","<b>Oblik</b>"],"redovi":[["ja","μπορ<b>ώ</b>"],["ti","μπορ<b>είς</b>"],["on/ona","μπορ<b>εί</b>"],["mi","μπορ<b>ούμε</b>"],["vi","μπορ<b>είτε</b>"],["oni","μπορ<b>ούν</b>"]]},{"tip":"pasus","tekst":"Po sličnom obrascu menjaju se i οδηγώ (voziti) i drugi glagoli na -ώ. Glagoli ευχαριστώ i παρακαλώ veoma su česti, ali njihove oblike je najbolje učiti kroz gotove fraze."},{"tip":"pasus","tekst":"<i>Μπορείτε να με βοηθήσετε;</i> = Možete li mi pomoći? <i>Δεν μπορώ.</i> = Ne mogu. <i>Μιλάτε αγγλικά;</i> = Govorite engleski?"},{"tip":"podnaslov","tekst":"Vežba 5"},{"tip":"pasus","tekst":"Prevedi: (a) Žedan sam. (b) Možemo li? (c) Ona ne govori srpski (σέρβικα). (d) Pitam."}]},{"vrsta":"lekcija","br":"6","naslov":"Množina i brojevi","blokovi":[{"tip":"podnaslov","tekst":"Množina imenica (nominativ i akuzativ)"},{"tip":"tabela","zaglavlje":["<b>Rod</b>","<b>Jednina</b>","<b>Množina (nom.)</b>","<b>Množina (akuz.)</b>"],"redovi":[["m\\. -ος","ο φίλος","<b>οι</b> φίλ<b>οι</b>","<b>τους</b> φίλ<b>ους</b>"],["m\\. -ας/-ης","ο άντρας","<b>οι</b> άντρ<b>ες</b>","<b>τους</b> άντρ<b>ες</b>"],["ž. -α/-η","η μπίρα","<b>οι</b> μπίρ<b>ες</b>","<b>τις</b> μπίρ<b>ες</b>"],["s\\. -ο","το κρασί → to je -ι","",""],["s\\. -ι","το ψωμί","<b>τα</b> ψωμ<b>ιά</b>","<b>τα</b> ψωμ<b>ιά</b>"],["s\\. -ο","το βιβλίο","<b>τα</b> βιβλί<b>α</b>","<b>τα</b> βιβλί<b>α</b>"]]},{"tip":"pasus","tekst":"Zapamti članove množine: <b>οι</b> (m.), <b>οι</b> (ž.), <b>τα</b> (s.) u nominativu; <b>τους / τις / τα</b> u akuzativu."},{"tip":"pasus","tekst":"<i>Θέλω δύο μπίρες.</i> = Hoću dva piva. <i>Τα παιδιά είναι εδώ.</i> = Deca su ovde."},{"tip":"podnaslov","tekst":"Brojevi"},{"tip":"tabela","zaglavlje":[],"redovi":[["1","ένα / ένας / μία","<b>e</b>na"],["2","δύο","<b>di</b>o"],["3","τρία","<b>tri</b>a"],["4","τέσσερα","<b>te</b>sera"],["5","πέντε","<b>pe</b>nde"],["6","έξι","<b>e</b>ksi"],["7","εφτά (επτά)","ef<b>ta</b>"],["8","οχτώ (οκτώ)","oh<b>to</b>"],["9","εννιά (εννέα)","e<b>nja</b>"],["10","δέκα","<b>d },{"tip":"pasus","tekst":"<b>Prodavnice:</b> το σούπερ μάρκετ, ο φούρνος (pekara), το κρεοπωλείο (mesara), το μανάβικο (piljarnica), το φαρμακείο (apoteka), το περίπτερο (kiosk), η λαϊκή αγορά (pijaca)"},{"tip":"podnaslov","tekst":"Dijalog 7 — U piljarnici"},{"tip":"pasus","tekst":"— Καλημέρα σας! Ορίστε; (o<b>ri</b>ste = Izvolite?) — Καλημέρα. Θα ήθελα ένα κιλό ντομάτες και μισό κιλό αγγούρια. — Μάλιστα. Τίποτα άλλο; — Ναι, έχετε φράουλες; — Βεβαίως. Πόσες θέλετε; — Ένα τέταρτο, παρακαλώ. Πόσο κάνουν όλα; — Επτά ευρώ και πενήντα λεπτά. — Ορίστε. Μια σακούλα, παρακαλώ. — Ευχαριστώ πολύ. Καλή σας μέρα!"},{"tip":"podnaslov","tekst":"Vežba 7"},{"tip":"pasus","tekst":"Sastavi dijalog u pekari: tražiš dva hleba i jednu pitu sa sirom, pitaš cenu, plaćaš karticom."}]},{"vrsta":"lekcija","br":"8","naslov":"Pridevi i opisivanje","blokovi":[{"tip":"pasus","tekst":"Pridev se <b>slaže</b> sa imenicom u rodu, broju i padežu. Obrazac -ος / -η / -ο."},{"tip":"tabela","zaglavlje":["","<b>Muški</b>","<b>Ženski</b>","<b>Srednji</b>"],"redovi":[["Nom. jd.","καλ<b>ός</b>","καλ<b>ή</b>","καλ<b>ό</b>"],["Akuz. jd.","καλ<b>ό</b>","καλ<b>ή</b>","καλ<b>ό</b>"],["Nom. mn.","καλ<b>οί</b>","καλ<b>ές</b>","καλ<b>ά</b>"],["Akuz. mn.","καλ<b>ούς</b>","καλ<b>ές</b>","καλ<b>ά</b>"]]},{"tip":"pasus","tekst":"<i>ο καλός καφές</i> — <i>η καλή μπίρα</i> — <i>το καλό κρασί</i>"},{"tip":"podnaslov","tekst":"Osnovni pridevi (parovi)"},{"tip":"tabela","zaglavlje":["<b>Grčki</b>","<b>Značenje</b>"],"redovi":[["καλός / κακός","dobar / loš"],["μεγάλος / μικρός","velik / mali"],["καινούριος / παλιός","nov / star"],["ακριβός / φθηνός","skup / jeftin"],["ζεστός / κρύος","topao / hladan"],["ωραίος","lep"],["πολύς / λίγος","mnogo / malo"],["φρέσκος","svež"],["νόστιμος","ukusan"],["ανοιχτό / κλειστό","otvoreno / zatvoreno"]]},{"tip":"podnaslov","tekst":"Boje"},{"tip":"pasus","tekst":"άσπρο (belo), μαύρο (crno), κόκκινο (crveno), μπλε (plavo), πράσινο (zeleno), κίτρινο (žuto), καφέ (braon), γκρι (sivo) Napomena: μπλ ίνη.","Alergičan sam na penicilin."],["Πόσες φορές την ημέρα;","Koliko puta dnevno?"],["Χρειάζομαι γιατρό.","Potreban mi je lekar."],["Μιλάει ο γιατρός αγγλικά;","Govori li lekar engleski?"]]},{"tip":"podnaslov","tekst":"5. Kada ne razumeš"},{"tip":"tabela","zaglavlje":["<b>Grčki</b>","<b>Značenje</b>"],"redovi":[["Μπορείτε να το επαναλάβετε;","Možete li ponoviti?"],["Μπορείτε να το γράψετε;","Možete li to napisati?"],["Τι σημαίνει αυτό;","Šta ovo znači?"],["Δεν μιλάω καλά ελληνικά.","Ne govorim dobro grčki."],["Καταλαβαίνω λίγο.","Razumem malo."],["Ένα λεπτό, παρακαλώ.","Trenutak, molim."]]},{"tip":"podnaslov","tekst":"Mini-dijalog — problem u hotelu"},{"tip":"pasus","tekst":"— Καλησπέρα. Το κλιματιστικό στο δωμάτιό μου δεν δουλεύει.\\ — Ποιος είναι ο αριθμός του δωματίου;\\ — Το διακόσια δώδεκα. Μπορείτε να το ελέγξετε;\\ — Βεβαίως. Θα έρθει κάποιος σε λίγα λεπτά.\\ — Ευχαριστώ πολύ."},{"tip":"pasus","tekst":"Prevod: — Dobro veče. Klima-uređaj u mojoj sobi ne radi. — Koji je broj sobe? — Dvesta dvanaest. Možete li proveriti? — Naravno. Neko će doći za nekoliko minuta. — Hvala mnogo."}]},{"vrsta":"odeljak","br":"","naslov":"PLAN RADA — 14 dana","blokovi":[{"tip":"tabela","zaglavlje":["<b>Dan</b>","<b>Sadržaj</b>","<b>Praktični cilj</b>"],"redovi":[["1","Lekcija 0","Čitanje slova, grupa glasova i 10 poznatih reči"],["2","Lekcije 1--2","Pozdravljanje, predstavljanje, rod i član"],["3","Lekcija 3","Traženje i kupovina jednostavnih stvari"],["4","Lekcija 4","Osnovni glagoli u prezentu"],["5","Lekcija 5","Moći, govoriti, pitati, glad i žeđ"],["6","Lekcija 6","Brojevi, količine, vreme i dani"],["7","Lekcija 7","Kupovina hrane i plaćanje"],["8","Lekcija 8","Opisivanje proizvoda, hrane i mesta"],["9","Lekcija 9","Porodica, pripadanje i lične stvari"],["10","Lekcija 10","Snalaženje i traženje pravca"],["11","Lekcija 11","Šta se dogodilo juče"],["12","Lekcija 12","Planovi, želje i učtivi zahtevi"],["13","Lekcija 13 + dodatak","Restoran, hotel, apoteka i prevoz"],["14","Lekcija 14","Ponavljanje, simulacija razgovora i samoprovera"]]},{"tip":"pasus","tekst":"Preporučeni dnevni raspored: 10 min ponavljanje prethodnog dana; 15 min nova gramatika; 15 min rečnik i glasno čitanje; 10--15 min dijalog i vežba bez gledanja u rešenja."},{"tip":"pasus","tekst":"Model-rešenje Vežbe 0: καλημέρα (kaliméra), ευχαριστώ (efharistó), ναι (ne), όχι (óhi), μπίρα (bíra), ψωμί (psomí), νερό (neró), είναι (íne), αυτό (aftó), τσάι (cái)."},{"tip":"pasus","tekst":"Model-rešenje Vežbe 7: — Καλημέρα. Θα ήθελα δύο ψωμιά και μία τυρόπιτα, παρακαλώ. — Βεβαίως. Τίποτα άλλο; — Όχι, ευχαριστώ. Πόσο κάνουν; — Έξι ευρώ. — Θα πληρώσω με κάρτα."},{"tip":"pasus","tekst":"Model-rešenje Vežbe 13: — Καλησπέρα. Ένα τραπέζι για τρεις, παρακαλώ. — Βεβαίως. — Τον κατάλογο, παρακαλώ. Θα θέλαμε μία σαλάτα και ένα μπουκάλι κρασί. — Μάλιστα. — Το λογαριασμό, παρακαλώ."}]},{"vrsta":"odeljak","br":"","naslov":"REŠENJA VEŽBI","blokovi":[{"tip":"pasus","tekst":"<b>Vežba 1:</b> (a) Είμαι από τη Σερβία. (b) Δεν είσαι Έλληνας. (c) Πώς σας λένε; (d) Δεν καταλαβαίνω, πιο αργά παρακαλώ. (e) Αυτοί είναι καλά."},{"tip":"pasus","tekst":"<b>Vežba 2:</b> το νερό, ο καφές, η μπίρα, το ψωμί, η γυναίκα, το κρασί."},{"tip":"pasus","tekst":"<b>Vežba 3:</b> (a) τον καφέ (b) την τιμή (c) τον λογαριασμό (d) το ψωμί."},{"tip":"pasus","tekst":"<b>Vežba 4:</b> αγοράζω, αγοράζεις, αγοράζει, αγοράζουμε, αγοράζετε, αγοράζουν. (a) Δεν καταλαβαίνουμε. (b) Τι πίνεις; (c) Ψάχνουν ένα ξενοδοχείο. (d) Περιμένω."},{"tip":"pasus","tekst":"<b>Vežba 5:</b> (a) Διψάω. (b) Μπορούμε; (c) Δεν μιλάει σέρβικα. (d) Ρωτάω."},{"tip":"pasus","tekst":"<b>Vežba 6:</b> οι φίλοι, οι τιμές, τα παιδιά. — τρία, δεκαπέντε, σαράντα, διακόσια πενήντα."},{"tip":"pasus","tekst":"<b>Vežba 8:</b> ένα μεγάλο ψωμί, μια κρύα μπίρα, ο καλός καφές, δύο φρέσκες ντομάτες."},{"tip":"pasus","tekst":"<b>Vežba 9:</b> (a) το διαβατήριό μου (b) το σπίτι της (c) η τιμή του ξενοδοχείου (d) τα παιδιά μας (e) το όνομα του φίλου σου."},{"tip":"pasus","tekst":"<b>Vežba 10:</b> (a) Πάω στο ξενοδοχείο. (b) Πού είναι ο σταθμός; (c) Καφές χωρίς ζάχαρη. (d) Η παραλία είναι μακριά. (e) Είμαι από τη Σερβία, είμαι στην Αθήνα."},{"tip":"pasus","tekst":"<b>Vežba 11:</b> (a) Χθες αγόρασα ψωμί. (b) Δεν πληρώσαμε. (c) Τι είπες; (d) Είδα τον Νίκο."},{"tip":"pasus","tekst":"<b>Vežba 12:</b> (a) Θα ήθελα μια μπίρα. (b) Πρέπει να φύγω. (c) Αύριο θα πάω στην Αθήνα. (d) Μπορείτε να με βοηθήσετε;"}]}];

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=t=>String(t).toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[čć]/g,"c").replace(/š/g,"s").replace(/ž/g,"z").replace(/đ/g,"dj")
  .replace(/ς/g,"σ");

let filter="sve", upit="";

/* ── tabovi ── */
let tab="kurs";
const HERO={
  kurs:["Petnaest lekcija gramatike, jedna dnevno — od azbuke do prošlog vremena. Rečnik, dijalog i vežbe sa rešenjima.",
        [[KURS.filter(k=>k.vrsta==="lekcija").length,"lekcija"],
         [KURS.reduce((n,k)=>n+k.blokovi.filter(b=>b.tip==="tabela").length,0),"tabela"],
         [14,"dana"]]],
  situacije:["Dvadeset četiri situacije — od jutarnje pite u pekari do vraćanja rentiranog auta. Rečnik, dijalog i vežba za svaku.",
        [[LEKCIJE.length,"situacija"],
         [LEKCIJE.reduce((n,l)=>n+(l.recnik||[]).length,0),"reči"],
         [LEKCIJE.reduce((n,l)=>n+(l.fraze||[]).length+(l.cuti||[]).length,0),"fraza"]]]
};
function crtajHero(){
  const [p,br]=HERO[tab];
  $("#hero-p").textContent=p;
  $("#brojke").innerHTML=br.map(([b,s])=>
    `<div class="brojka"><b>${b}</b><span>${s}</span></div>`).join("");
}
$("#tabovi").onclick=e=>{
  const b=e.target.closest("[data-tab]"); if(!b)return;
  tab=b.dataset.tab;
  [...$("#tabovi").children].forEach(x=>x.classList.toggle("on",x===b));
  $("#panel-kurs").hidden = tab!=="kurs";
  $("#panel-situacije").hidden = tab!=="situacije";
  $("#q").placeholder = tab==="kurs"
    ? "Traži u kursu — npr. aorist, γεια, brojevi"
    : "Traži reč ili frazu — npr. račun, νερό, plaža";
  crtajHero(); crtaj();
};

/* filteri */
const grupe=["sve",...new Set(LEKCIJE.map(l=>l.grupa))];
$("#filteri").innerHTML=grupe.map(g=>
  `<button class="mini ${g==='sve'?'on':''}" data-g="${esc(g)}">${g==='sve'?'Sve lekcije':esc(g)}</button>`).join("");
$("#filteri").onclick=e=>{
  const b=e.target.closest("[data-g]"); if(!b)return;
  filter=b.dataset.g;
  [...$("#filteri").children].forEach(x=>x.classList.toggle("on",x===b));
  crtaj();
};

/* pretraga */
$("#q").oninput=e=>{upit=norm(e.target.value.trim());crtaj();};

function tekstLekcije(l){
  return [l.id,l.naslov,l.gr,l.opis,l.napomena||"",
    ...(l.recnik||[]).flat(),...(l.fraze||[]).flat(),
    ...(l.dijalog||[]).flat(),...(l.cuti||[]).flat(),
    ...(l.vezba||[]).flat()].join(" ");
}

function crtaj(){
  if(tab==="kurs") return crtajKurs();
  const lista=LEKCIJE.filter(l=>
    (filter==="sve"||l.grupa===filter) &&
    (!upit||norm(tekstLekcije(l)).includes(upit)));
  $("#mreza").innerHTML = lista.length ? lista.map(l=>`
    <button class="kart" data-id="${l.id}">
      <span class="oznaka">${esc(l.id)} · ${esc(l.grupa)}</span>
      <h3>${esc(l.naslov)}</h3>
      <p class="gr">${esc(l.gr)}</p>
      <p class="op">${esc(l.opis)}</p>
    </button>`).join("")
    : `<p class="prazno">Ništa za „${esc($("#q").value)}“. Probaj drugu reč — na srpskom ili grčkom.</p>`;
}
$("#mreza").onclick=e=>{
  const b=e.target.closest("[data-id]"); if(b) otvori(b.dataset.id);
};

/* ── kurs: mreža lekcija ── */
function tekstKursa(k){
  const d=[];
  k.blokovi.forEach(b=>{
    if(b.tekst) d.push(b.tekst);
    if(b.stavke) d.push(b.stavke.join(" "));
    if(b.redovi) d.push(b.redovi.flat().join(" "));
    if(b.zaglavlje) d.push(b.zaglavlje.join(" "));
  });
  return k.naslov+" "+d.join(" ");
}
function crtajKurs(){
  const lista=KURS.filter(k=>!upit||norm(tekstKursa(k)).includes(upit));
  $("#dani").innerHTML = lista.length ? lista.map((k,i)=>`
    <button class="dan ${k.vrsta==='odeljak'?'o':''}" data-k="${KURS.indexOf(k)}">
      <span class="dan-br">${k.vrsta==='lekcija'?esc(k.br):'§'}</span>
      <span>
        <h3>${esc(k.naslov)}</h3>
        <span class="pod">${k.vrsta==='lekcija'?'Lekcija '+esc(k.br):'Odeljak'} · ${k.blokovi.filter(b=>b.tip==='podnaslov').length} celina</span>
      </span>
    </button>`).join("")
    : `<p class="prazno">Ništa za „${esc($("#q").value)}“ u kursu.</p>`;
}
$("#dani").onclick=e=>{
  const b=e.target.closest("[data-k]"); if(b) otvoriKurs(+b.dataset.k);
};
function blokHtml(b){
  if(b.tip==="podnaslov") return `<h4>${b.tekst}</h4>`;
  if(b.tip==="pasus")     return `<p class="k-pasus">${b.tekst}</p>`;
  if(b.tip==="lista")     return `<ul class="k-lista">${b.stavke.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.tip==="tabela"){
    const zag=b.zaglavlje&&b.zaglavlje.some(x=>x)
      ? `<thead><tr>${b.zaglavlje.map(x=>`<th>${x}</th>`).join("")}</tr></thead>`:"";
    return `<div class="k-omot"><table class="k-tab">${zag}<tbody>`+
      b.redovi.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")+
      `</tbody></table></div>`;
  }
  return "";
}
function otvoriKurs(i){
  const k=KURS[i]; if(!k)return;
  $("#m-oznaka").textContent = k.vrsta==="lekcija" ? "Lekcija "+k.br : "Odeljak";
  $("#m-naslov").textContent = k.naslov;
  $("#m-gr").textContent = k.vrsta==="lekcija" ? "Dan "+k.br+" od 14" : "";
  $("#m-telo").innerHTML = k.blokovi.map(blokHtml).join("");
  $("#m-telo").scrollTop=0;
  $("#modal").classList.add("vidi");
  document.body.style.overflow="hidden";
  $("#zatvori").focus();
}

/* modal */
function otvori(id){
  const l=LEKCIJE.find(x=>x.id===id); if(!l)return;
  $("#m-oznaka").textContent=l.id+" · "+l.grupa;
  $("#m-naslov").textContent=l.naslov;
  $("#m-gr").textContent=l.gr;
  let h="";
  const par=([g,i,s])=>`<div class="par"><div class="g">${esc(g)}</div><div class="iz">${esc(i)}</div><div class="s">${esc(s)}</div></div>`;
  if(l.cuti) h+=`<h4>Šta ćeš najčešće čuti</h4>`+l.cuti.map(par).join("");
  if(l.recnik) h+=`<h4>Rečnik</h4><div class="rec">`+
    l.recnik.map(([g,i,s])=>`<div class="g">${esc(g)}</div><div class="iz">${esc(i)}</div><div>${esc(s)}</div>`).join("")+`</div>`;
  if(l.dijalog) h+=`<h4>Dijalog</h4><div class="dij">`+
    l.dijalog.map(([g,iz,s],i)=>`<div class="replika ${i%2?'b':''}"><div class="g">${esc(g)}</div><div class="iz">${esc(iz)}</div><div class="s">${esc(s)}</div></div>`).join("")+`</div>`;
  if(l.fraze) h+=`<h4>Korisne fraze</h4>`+l.fraze.map(par).join("");
  if(l.napomena) h+=`<h4>Kako Grci zaista govore</h4><div class="napomena">${esc(l.napomena)}</div>`;
  if(l.vezba) h+=`<h4>Mini vežba</h4><div class="vezba">`+
    l.vezba.map(([p,o,iz])=>`<div class="zad"><div class="pit">${esc(p)}</div>
      <button class="otkrij">Prikaži odgovor</button>
      <div class="odg">${esc(o)}<div class="iz">${esc(iz)}</div></div></div>`).join("")+`</div>`;
  $("#m-telo").innerHTML=h;
  $("#m-telo").scrollTop=0;
  $("#modal").classList.add("vidi");
  document.body.style.overflow="hidden";
  $("#zatvori").focus();
}
$("#m-telo").onclick=e=>{
  const b=e.target.closest(".otkrij"); if(!b)return;
  const o=b.nextElementSibling;
  const otvoreno=o.classList.toggle("vidi");
  b.textContent=otvoreno?"Sakrij odgovor":"Prikaži odgovor";
};
function zatvoriModal(){
  $("#modal").classList.remove("vidi");
  document.body.style.overflow="";
}
$("#zatvori").onclick=zatvoriModal;
$("#modal").onclick=e=>{if(e.target===$("#modal"))zatvoriModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")zatvoriModal();});

/* kartice za učenje */
let fond=[],idx=0,okrenuto=false;
$("#btn-flip").onclick=()=>{
  fond=LEKCIJE.flatMap(l=>(l.recnik||[]).map(([g,i,s])=>[g,i,s,l.naslov]))
        .sort(()=>Math.random()-.5);
  idx=0;okrenuto=false;
  $("#m-oznaka").textContent="vežba";
  $("#m-naslov").textContent="Kartice";
  $("#m-gr").textContent="Prevedi na srpski, pa okreni karticu";
  crtajKarticu();
  $("#modal").classList.add("vidi");
  document.body.style.overflow="hidden";
};
function crtajKarticu(){
  const [g,iz,s,lek]=fond[idx];
  $("#m-telo").innerHTML=`
    <div class="karta-flip">
      <div class="veliko">${esc(g)}</div>
      <div class="malo">${okrenuto?esc(s)+" · "+esc(lek):"&nbsp;"}</div>
      <div class="malo" style="font:400 15px 'IBM Plex Mono',monospace;color:var(--maslina)">${esc(iz)}</div>
    </div>
    <div class="flip-kontrole">
      <button class="mini" id="f-okreni">${okrenuto?"Sakrij":"Okreni"}</button>
      <button class="mini" id="f-dalje">Sledeća reč</button>
    </div>
    <div class="flip-brojac">${idx+1} / ${fond.length}</div>`;
  $("#f-okreni").onclick=()=>{okrenuto=!okrenuto;crtajKarticu();};
  $("#f-dalje").onclick=()=>{idx=(idx+1)%fond.length;okrenuto=false;crtajKarticu();};
}

crtajHero();
crtaj();
</script>
</body>
</html>
