<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rečnik — Ελληνικά</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gips:#FBF9F4; --gips2:#F2EEE4;
  --egej:#2E6FA7; --egej-svetlo:#DCE9F4;
  --bugenvilija:#C6497B; --maslina:#6E7F4E;
  --mastilo:#1E2A33; --tiho:#6B7A85;
  --ivica:#E3DDD0; --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--gips);color:var(--mastilo);
  font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--egej)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:50;background:rgba(251,249,244,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--ivica)}
.hd{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{font:800 22px/1 Fraunces,serif;letter-spacing:-.02em;white-space:nowrap;text-decoration:none;color:var(--mastilo)}
.logo span{color:var(--egej)}
#q{flex:1;min-width:180px;border:1.5px solid var(--ivica);border-radius:999px;
  padding:10px 16px;font:400 15px Inter,sans-serif;background:#fff;color:var(--mastilo)}
#q:focus{outline:none;border-color:var(--egej);box-shadow:0 0 0 3px var(--egej-svetlo)}
.mini{border:1.5px solid var(--ivica);background:#fff;border-radius:999px;
  padding:9px 14px;font:500 14px Inter,sans-serif;color:var(--mastilo);cursor:pointer}
.mini:hover{border-color:var(--egej);color:var(--egej)}
.mini.on{background:var(--egej);border-color:var(--egej);color:#fff}
.veze{display:flex;gap:8px;flex-wrap:wrap}

.hero{padding:44px 0 30px;border-bottom:1px solid var(--ivica)}
.hero h1{font:800 clamp(30px,5vw,46px)/1.05 Fraunces,serif;letter-spacing:-.03em;margin:0 0 12px}
.hero h1 em{font-style:normal;color:var(--egej)}
.hero p{font-size:17px;color:var(--tiho);max-width:56ch;margin:0 0 20px}
.brojke{display:flex;gap:28px;flex-wrap:wrap}
.brojka b{display:block;font:600 26px Fraunces,serif;color:var(--bugenvilija)}
.brojka span{font-size:13px;color:var(--tiho);text-transform:uppercase;letter-spacing:.08em}

.voc-alat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:22px 0 10px}
.voc-broj{font:500 13px 'IBM Plex Mono',monospace;color:var(--tiho);margin-left:auto}
.voc-tema{background:#fff;border:1px solid var(--ivica);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden}
.voc-tema summary{list-style:none;cursor:pointer;padding:15px 18px;
  display:flex;align-items:center;gap:14px;font:600 16px Fraunces,serif}
.voc-tema summary::-webkit-details-marker{display:none}
.voc-tema summary:hover{color:var(--egej)}
.voc-tema .vt-n{margin-left:auto;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;
  color:var(--egej);background:var(--egej-svetlo);padding:3px 9px;border-radius:6px}
.voc-tema .vt-plus{color:var(--tiho);font-size:20px;line-height:1;transition:transform .25s}
.voc-tema[open] .vt-plus{transform:rotate(45deg);color:var(--egej)}
.voc-tema[open] summary{border-bottom:1px solid var(--ivica)}
.voc-tab{width:100%;border-collapse:collapse;font-size:15px}
.voc-tab td{padding:8px 18px;border-bottom:1px solid var(--gips2);vertical-align:top}
.voc-tab tr:last-child td{border-bottom:none}
.voc-tab tr:hover{background:var(--gips)}
.voc-tab .v-gr{font-weight:600;color:var(--egej);width:36%}
.voc-tab .v-iz{font:400 13px 'IBM Plex Mono',monospace;color:var(--maslina);width:28%}
.voc-tab .v-sr{color:var(--mastilo)}
.voc-prazno{padding:40px 0;text-align:center;color:var(--tiho)}
mark{background:#FCE9A0;color:var(--mastilo);padding:0 2px;border-radius:3px}

/* modal kartica */
.pozadina{position:fixed;inset:0;background:rgba(30,42,51,.45);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.pozadina.vidi{display:flex}
.list{background:var(--gips);border-radius:18px;max-width:560px;width:100%;
  box-shadow:0 24px 60px rgba(30,42,51,.28);position:relative}
.list-vrh{background:var(--gips);border-bottom:1px solid var(--ivica);
  padding:22px 26px 16px;border-radius:18px 18px 0 0}
.list-vrh h2{font:800 26px/1.1 Fraunces,serif;margin:8px 0 2px;letter-spacing:-.02em}
.list-vrh .gr{color:var(--bugenvilija);font-size:15px;margin:0}
.zatvori{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--ivica);background:#fff;cursor:pointer;font-size:18px;color:var(--tiho);line-height:1}
.zatvori:hover{border-color:var(--bugenvilija);color:var(--bugenvilija)}
.telo{padding:16px 26px 30px}
.oznaka{display:inline-block;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;
  color:var(--egej);background:var(--egej-svetlo);padding:3px 8px;border-radius:6px}
.karta-flip{background:#fff;border:1px solid var(--ivica);border-radius:14px;
  padding:22px 18px;text-align:center;min-height:130px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.karta-flip .veliko{font:600 22px Inter,system-ui,sans-serif;color:var(--egej);line-height:1.3;letter-spacing:-.01em}
.karta-flip .malo{font-size:15px;color:var(--tiho);min-height:20px}
.smer-red{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-bottom:12px;font-size:13px;color:var(--tiho)}
.smer-grupa{display:inline-flex;border:1px solid var(--ivica);border-radius:999px;overflow:hidden}
.smer-grupa button{border:none;background:#fff;padding:7px 15px;cursor:pointer;
  font:600 13px Inter,sans-serif;color:var(--tiho);transition:.15s}
.smer-grupa button.on{background:var(--egej);color:#fff}
.flip-kontrole{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.flip-brojac{text-align:center;font:500 13px 'IBM Plex Mono',monospace;color:var(--tiho);margin-top:10px}
.tema-izbor{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.tema-izbor button{border:1px solid var(--ivica);background:#fff;border-radius:999px;
  padding:5px 11px;font:500 12px Inter,sans-serif;color:var(--tiho);cursor:pointer}
.tema-izbor button.on{background:var(--egej);border-color:var(--egej);color:#fff}

footer{border-top:1px solid var(--ivica);padding:30px 0 44px;color:var(--tiho);font-size:14px}

/* ── brze fraze ── */
.fr-tema{background:#fff;border:1px solid var(--ivica);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.fr-tema summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:14px;font:600 16px Fraunces,serif}
.fr-tema summary::-webkit-details-marker{display:none}
.fr-tema summary:hover{color:var(--egej)}
.fr-tema .vt-n{margin-left:auto;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--bugenvilija);background:#F6E4EC;padding:3px 9px;border-radius:6px}
.fr-tema .vt-plus{color:var(--tiho);font-size:20px;line-height:1;transition:transform .25s}
.fr-tema[open] .vt-plus{transform:rotate(45deg);color:var(--egej)}
.fr-tema[open] summary{border-bottom:1px solid var(--ivica)}
.fr-blok{padding:14px 18px;border-bottom:1px solid var(--gips2)}
.fr-blok:last-child{border-bottom:none}
.fr-glava{margin-bottom:9px}
.fr-gr{font:600 17px Inter,sans-serif;color:var(--egej)}
.fr-iz{font:400 13px 'IBM Plex Mono',monospace;color:var(--maslina);margin:2px 0}
.fr-sr{font-size:15px;color:var(--mastilo);font-weight:500}
.fr-prim{border-left:2px solid var(--egej-svetlo);padding:7px 0 7px 14px;margin:8px 0 0 2px}
.fr-prim .p-gr{font-size:14.5px;color:var(--mastilo)}
.fr-prim .p-iz{font:400 12.5px 'IBM Plex Mono',monospace;color:var(--maslina)}
.fr-prim .p-sr{font-size:13.5px;color:var(--tiho)}
.podnavi{display:flex;gap:6px;background:var(--gips2);padding:4px;border-radius:999px;width:fit-content;margin:22px 0 4px}
.podnavi button{border:none;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;font:600 14px Inter,sans-serif;color:var(--tiho);white-space:nowrap}
.podnavi button.on{background:#fff;color:var(--egej);box-shadow:0 1px 3px rgba(30,42,51,.10)}

@media(max-width:560px){
  .voc-tab td{padding:7px 12px;font-size:14px}
  .voc-tab .v-iz{display:none}
  .voc-tab .v-gr{width:45%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="logo" href="index.html">Ελληνικά<span>.</span></a>
    <input id="q" type="search" placeholder="Traži reč — npr. račun, νερό, plaža" aria-label="Pretraga">
    <div class="veze">
      <a class="mini" href="index.html">Kurs</a>
      <button class="mini" id="btn-flip">Kartice</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Rečnik <em>po temama</em>.</h1>
    <p>Rečnik po temama i <b>brze fraze sa primerima u rečenicama</b> — ono što se stvarno govori. Otvori temu da vidiš spisak, ili pretraži na srpskom i grčkom.</p>
    <div class="brojke" id="brojke"></div>
  </div>
</section>

<div class="wrap">
  <div class="podnavi" id="podnavi">
    <button class="on" data-p="recnik">Rečnik</button>
    <button data-p="fraze">Brze fraze</button>
  </div>
  <div class="voc-alat">
    <button class="mini" id="voc-otvori">Otvori sve</button>
    <button class="mini" id="voc-zatvori">Zatvori sve</button>
    <span class="voc-broj" id="voc-broj"></span>
  </div>
  <div id="voc-lista" style="padding-bottom:60px"></div>
  <div id="fr-lista" style="padding-bottom:60px" hidden></div>
</div>

<footer class="wrap">
  Praktični kurs grčkog jezika · rečnik i kartice · <a href="index.html">nazad na kurs</a>
</footer>

<div class="pozadina" id="modal">
  <div class="list" role="dialog" aria-modal="true">
    <div class="list-vrh">
      <button class="zatvori" id="zatvori" aria-label="Zatvori">✕</button>
      <span class="oznaka">vežba</span>
      <h2>Kartice</h2>
      <p class="gr" id="m-gr"></p>
    </div>
    <div class="telo" id="m-telo"></div>
  </div>
</div>

"Zdravlje i hitno": [

["Είναι επείγον","íne epígon","Hitno je",[

"Učtivost i sitne reakcije": [

/* ══════════ POMOĆNE ══════════ */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm = t => String(t).toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[čć]/g,"c").replace(/š/g,"s").replace(/ž/g,"z").replace(/đ/g,"dj")
  .replace(/ς/g,"σ");

const TEME = Object.keys(RECNIK);
const UKUPNO = TEME.reduce((n,t) => n + RECNIK[t].length, 0);
const FR_TEME = Object.keys(FRAZE);
const FR_UKUPNO = FR_TEME.reduce((n,t) => n + FRAZE[t].length, 0);
const FR_PRIMERA = FR_TEME.reduce((n,t) => n + FRAZE[t].reduce((s,f)=>s+f[3].length,0), 0);
let sekcija = 'recnik';

let upit = "";

$("#brojke").innerHTML = [
  [UKUPNO, "reči"], [FR_UKUPNO, "fraza"], [FR_PRIMERA, "primera"]
].map(([b,s]) => `<div class="brojka"><b>${b}</b><span>${s}</span></div>`).join("");

/* ══════════ ISCRTAVANJE ══════════ */
function istakni(s, q){
  if(!q) return esc(s);
  s = String(s);
  // mapiranje: za svaki znak originala pamtimo gde pada u normalizovanom tekstu
  let n = '', mapa = [];
  for(let k = 0; k < s.length; k++){
    const dео = norm(s[k]);
    for(let j = 0; j < deo_len(dео); j++) mapa.push(k);
    n += dео;
  }
  const i = n.indexOf(q);
  if(i < 0) return esc(s);
  const poc = mapa[i];
  const kraj = (i + q.length < mapa.length) ? mapa[i + q.length] : s.length;
  return esc(s.slice(0, poc)) + '<mark>' + esc(s.slice(poc, kraj)) + '</mark>' + esc(s.slice(kraj));
}
function deo_len(x){ return x.length; }

function crtajRecnik(){
  let html = '', ukupno = 0;
  TEME.forEach(tema => {
    const redovi = RECNIK[tema].filter(r => !upit || norm(r.join(' ')).includes(upit));
    if(!redovi.length) return;
    ukupno += redovi.length;
    html += `<details class="voc-tema"${upit ? ' open' : ''}>`;
    html += `<summary>${esc(tema)}<span class="vt-n">${redovi.length}</span><span class="vt-plus">+</span></summary>`;
    html += `<table class="voc-tab"><tbody>`;
    redovi.forEach(([g, iz, s]) => {
      html += `<tr><td class="v-gr">${istakni(g, upit)}</td>`
           +  `<td class="v-iz">${esc(iz || '')}</td>`
           +  `<td class="v-sr">${istakni(s || '', upit)}</td></tr>`;
    });
    html += `</tbody></table></details>`;
  });
  $("#voc-lista").innerHTML = html || `<p class="voc-prazno">Ništa za „${esc($("#q").value)}“.</p>`;
  $("#voc-broj").textContent = upit ? `${ukupno} rezultata` : `${ukupno} reči · ${TEME.length} tema`;
}

$("#q").oninput = e => { upit = norm(e.target.value.trim()); crtajSekciju(); };



/* ══════════ BRZE FRAZE ══════════ */

function crtajFraze(){
  let html = '', uk = 0;
  FR_TEME.forEach(tema => {
    const blokovi = FRAZE[tema].filter(f => {
      if(!upit) return true;
      const svetekst = f[0]+' '+f[1]+' '+f[2]+' '+f[3].map(p=>p.join(' ')).join(' ');
      return norm(svetekst).includes(upit);
    });
    if(!blokovi.length) return;
    uk += blokovi.length;
    html += `<details class="fr-tema"${upit ? ' open' : ''}>`;
    html += `<summary>${esc(tema)}<span class="vt-n">${blokovi.length}</span><span class="vt-plus">+</span></summary>`;
    blokovi.forEach(([gr, iz, sr, primeri]) => {
      html += `<div class="fr-blok"><div class="fr-glava">`;
      html += `<div class="fr-gr">${istakni(gr, upit)}</div>`;
      html += `<div class="fr-iz">${esc(iz)}</div>`;
      html += `<div class="fr-sr">${istakni(sr, upit)}</div></div>`;
      primeri.forEach(([pg, pi, ps]) => {
        html += `<div class="fr-prim">`;
        html += `<div class="p-gr">${istakni(pg, upit)}</div>`;
        html += `<div class="p-iz">${esc(pi)}</div>`;
        html += `<div class="p-sr">${istakni(ps, upit)}</div></div>`;
      });
      html += `</div>`;
    });
    html += `</details>`;
  });
  document.querySelector('#fr-lista').innerHTML = html ||
    `<p class="voc-prazno">Ništa za \u201E${esc(document.querySelector('#q').value)}\u201C.</p>`;
  document.querySelector('#voc-broj').textContent =
    upit ? `${uk} rezultata` : `${FR_UKUPNO} fraza \u00b7 ${FR_PRIMERA} primera`;
}

function crtajSekciju(){
  const jeRecnik = sekcija === 'recnik';
  document.querySelector('#voc-lista').hidden = !jeRecnik;
  document.querySelector('#fr-lista').hidden  = jeRecnik;
  document.querySelector('#q').placeholder = jeRecnik
    ? 'Tra\u017Ei re\u010D \u2014 npr. ra\u010Dun, \u03BD\u03B5\u03C1\u03CC, pla\u017Ea'
    : 'Tra\u017Ei frazu \u2014 npr. koliko ko\u0161ta, \u03C0\u03AC\u03BC\u03B5, izgubio';
  if(jeRecnik) crtajRecnik(); else crtajFraze();
}

document.querySelector('#podnavi').onclick = e => {
  const b = e.target.closest('[data-p]'); if(!b) return;
  sekcija = b.dataset.p;
  document.querySelectorAll('#podnavi button').forEach(x => x.classList.toggle('on', x === b));
  crtajSekciju();
};

document.querySelector('#voc-otvori').onclick = () =>
  document.querySelectorAll((sekcija==='recnik'?'#voc-lista':'#fr-lista')+' details').forEach(d => d.open = true);
document.querySelector('#voc-zatvori').onclick = () =>
  document.querySelectorAll((sekcija==='recnik'?'#voc-lista':'#fr-lista')+' details').forEach(d => d.open = false);

/* ══════════ KARTICE ══════════ */
let fond = [], idx = 0, okrenuto = false, smer = 'GR', temaFiltar = 'sve';

function napuniFond(){
  const frazeKarte = FR_TEME.flatMap(t => FRAZE[t].map(([g,i,s]) => [g,i,s,t]));
  const svePojmove = TEME.flatMap(t => RECNIK[t].map(([g,i,s]) => [g,i,s,t])).concat(frazeKarte);
  const izvor = temaFiltar === 'sve'
    ? svePojmove
    : (RECNIK[temaFiltar]
        ? RECNIK[temaFiltar].map(([g,i,s]) => [g,i,s,temaFiltar])
        : FRAZE[temaFiltar].map(([g,i,s]) => [g,i,s,temaFiltar]));
  fond = izvor.sort(() => Math.random() - .5);
  idx = 0; okrenuto = false;
}

$("#btn-flip").onclick = () => {
  napuniFond();
  $("#modal").classList.add("vidi");
  document.body.style.overflow = "hidden";
  crtajKarticu();
};

function crtajKarticu(){
  if(!fond.length){ $("#m-telo").innerHTML = '<p class="voc-prazno">Nema reči.</p>'; return; }
  const [g, iz, s, tema] = fond[idx];
  const lice    = smer === 'GR' ? g : s;
  const nalicje = smer === 'GR' ? s : g;
  const pomoc   = smer === 'GR' ? iz : (okrenuto ? iz : '');
  $("#m-gr").textContent = fond.length + ' reči' + (temaFiltar==='sve' ? ' iz celog rečnika' : ' · ' + temaFiltar);

  $("#m-telo").innerHTML = `
    <div class="smer-red">
      <span>Smer:</span>
      <span class="smer-grupa">
        <button id="s-gr" class="${smer==='GR'?'on':''}">GR → SR</button>
        <button id="s-sr" class="${smer==='SR'?'on':''}">SR → GR</button>
      </span>
    </div>
    <div class="tema-izbor">
      <button data-t="sve" class="${temaFiltar==='sve'?'on':''}">sve teme</button>
      ${TEME.concat(FR_TEME).map(t=>`<button data-t="${esc(t)}" class="${temaFiltar===t?'on':''}">${esc(t)}</button>`).join('')}
    </div>
    <div class="karta-flip">
      <div class="veliko">${esc(lice)}</div>
      <div class="malo">${okrenuto ? esc(nalicje) + ' · ' + esc(tema) : '&nbsp;'}</div>
      <div class="malo" style="font:400 13px 'IBM Plex Mono',monospace;color:var(--maslina)">${esc(pomoc || '')}</div>
    </div>
    <div class="flip-kontrole">
      <button class="mini" id="f-okreni">${okrenuto ? 'Sakrij' : 'Okreni'}</button>
      <button class="mini" id="f-nazad">← Nazad</button>
      <button class="mini" id="f-dalje">Dalje →</button>
      <button class="mini" id="f-mesaj">Promešaj</button>
    </div>
    <div class="flip-brojac">${idx+1} / ${fond.length}</div>`;

  $("#f-okreni").onclick = () => { okrenuto = !okrenuto; crtajKarticu(); };
  $("#f-dalje").onclick  = () => { idx = (idx+1) % fond.length; okrenuto = false; crtajKarticu(); };
  $("#f-nazad").onclick  = () => { idx = (idx-1+fond.length) % fond.length; okrenuto = false; crtajKarticu(); };
  $("#f-mesaj").onclick  = () => { fond.sort(() => Math.random()-.5); idx = 0; okrenuto = false; crtajKarticu(); };
  $("#s-gr").onclick = () => { smer='GR'; okrenuto=false; crtajKarticu(); };
  $("#s-sr").onclick = () => { smer='SR'; okrenuto=false; crtajKarticu(); };
  document.querySelectorAll('.tema-izbor button').forEach(b => {
    b.onclick = () => { temaFiltar = b.dataset.t; napuniFond(); crtajKarticu(); };
  });
}

function zatvoriModal(){
  $("#modal").classList.remove("vidi");
  document.body.style.overflow = "";
}
$("#zatvori").onclick = zatvoriModal;
$("#modal").onclick = e => { if(e.target === $("#modal")) zatvoriModal(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape") zatvoriModal();
  if(!$("#modal").classList.contains("vidi")) return;
  if(e.key === "ArrowRight" && fond.length){ idx=(idx+1)%fond.length; okrenuto=false; crtajKarticu(); }
  if(e.key === "ArrowLeft"  && fond.length){ idx=(idx-1+fond.length)%fond.length; okrenuto=false; crtajKarticu(); }
  if(e.key === " " && fond.length){ e.preventDefault(); okrenuto=!okrenuto; crtajKarticu(); }
});

crtajRecnik();
</script>
